plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.12'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.ticketing'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()

	maven {
		name = "GitHubPackages"
		url = uri("https://maven.pkg.github.com/3s-ticketing/common-module")
		credentials {
			username = System.getenv("GPR_USER")
			password = System.getenv("GPR_TOKEN")
		}
	}
}

ext {
	springCloudVersion = "2025.0.1"
}

dependencies {
	// 공통 모듈 (org.ticketing:common:2.0-SNAPSHOT 로 publish 됨)
	implementation 'org.ticketing:common:2.0-SNAPSHOT'

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()

	systemProperty 'spring.profiles.active', 'test'
	systemProperty 'spring.cloud.config.enabled', 'false'
	systemProperty 'spring.cloud.config.fail-fast', 'false'
	systemProperty 'spring.cloud.bootstrap.enabled', 'false'
	systemProperty 'spring.cloud.discovery.enabled', 'false'
	systemProperty 'eureka.client.enabled', 'false'
}
